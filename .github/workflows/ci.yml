name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      # `--ignore-scripts` skips the @abandonware/noble native build, which is
      # not needed to typecheck, lint or transpile.
      - name: Install packages 📦
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck 🏷
        run: pnpm typecheck

      - name: Lint 👓
        run: pnpm lint

      - name: Build output 🛠
        run: pnpm build
